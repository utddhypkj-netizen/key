<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKzta // Key Android</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#02030a;--ink:#e8ecff;--dim:#8a93c4;--glow:#8b7bff;--hot:#ff9f43;--line:rgba(139,123,255,.35)}
html,body{background:var(--bg)}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-x:hidden}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:2;width:100%;max-width:520px}
.title{text-align:center;font-size:1.7rem;font-weight:800;letter-spacing:5px;color:#fff;text-shadow:0 0 18px var(--glow),0 0 40px rgba(139,123,255,.5)}
.subtitle{text-align:center;margin:8px 0 22px;color:var(--dim);font-size:.95rem}
.card{background:rgba(8,10,28,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 28px rgba(139,123,255,.15)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.client{font-size:1.4rem;font-weight:700;color:#fff}
.tag{font-size:.78rem;color:var(--hot);border:1px solid rgba(255,159,67,.45);border-radius:20px;padding:3px 11px;background:rgba(255,159,67,.08);white-space:nowrap}
.keybox{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.55)}
.key{flex:1;min-width:0;padding:14px 12px;color:#cfd6ff;font:600 .95rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;background:transparent;border:none;outline:none;text-overflow:ellipsis}
.key::selection{background:var(--glow);color:#fff}
.copy{border:none;background:linear-gradient(135deg,#8b7bff,#5b8cff);color:#fff;padding:0 22px;font:700 .85rem system-ui,sans-serif;letter-spacing:1px;cursor:pointer}
.copy:hover{filter:brightness(1.15)}
.copy:active{transform:scale(.96)}
.copy:focus-visible,.key:focus-visible{outline:2px solid var(--hot);outline-offset:-2px}
.copy.done{background:linear-gradient(135deg,#1fa971,#2fd49a)}
.status{font-size:.85rem;min-height:18px;color:var(--dim)}
.status.ok{color:#5be3ae}
.status.err{color:#ff7a7a}
.hint{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;color:var(--dim);font-size:.85rem;line-height:1.7}
.hint strong{color:#fff}
.brand{position:fixed;right:20px;bottom:16px;z-index:3;font-weight:800;letter-spacing:4px;color:#fff;text-shadow:0 0 14px var(--glow);user-select:none}
@media(max-width:640px){.title{font-size:1.35rem;letter-spacing:3px}}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="title">IKZTA KEY</div>
  <div class="subtitle">Key dành cho client Android</div>

  <div class="card">
    <div class="card-top">
      <div class="client">Android</div>
      <div class="tag">Key Android</div>
    </div>
    <div class="keybox">
      <!-- ▼▼▼ CHỈNH KEY TẠI ĐÂY (thuộc tính value) ▼▼▼ -->
      <input class="key" id="keyInput" type="text" value="IKzta-AND-Zp83LcT5wB-pulsar" readonly spellcheck="false" aria-label="Key Android">
      <!-- ▲▲▲ KẾT THÚC CHỈNH KEY ▲▲▲ -->
      <button class="copy" id="copyBtn">COPY</button>
    </div>
    <div class="status" id="status"></div>
    <div class="hint">
      <strong>Hướng dẫn:</strong> bấm COPY rồi dán vào ô nhập key của client Android.<br>
      <strong>Lưu ý:</strong> key chỉ có hiệu lực một lần, hãy dùng ngay.
    </div>
  </div>
</div>

<div class="brand">IKzta</div>

<script>
const input = document.getElementById('keyInput'), btn = document.getElementById('copyBtn'), status = document.getElementById('status');
input.addEventListener('click', () => input.select());
btn.addEventListener('click', () => {
  input.select(); input.setSelectionRange(0, 99999);
  const ok = () => {
    status.className = 'status ok'; status.textContent = '✔ Đã sao chép key Android';
    btn.textContent = 'COPIED'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('done'); status.className = 'status'; status.textContent = ''; }, 2500);
  };
  const fail = () => { status.className = 'status err'; status.textContent = '✘ Không sao chép được, hãy chọn key thủ công.'; };
  const fallback = () => { try { document.execCommand('copy') ? ok() : fail(); } catch (e) { fail(); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(input.value).then(ok).catch(fallback);
  else fallback();
});

/* ===== NỀN VŨ TRỤ: tinh vân + sao 3 lớp + sao băng + hố đen ===== */
const cv = document.getElementById('space'), cx = cv.getContext('2d');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
let W, H, stars = [], disk = [], ring = [], shooters = [], T = 0;
const NEB = [
  { x: .2, y: .25, r: .55, c: '120,80,255', a: .20, sp: .00022 },
  { x: .8, y: .35, r: .5,  c: '40,120,255', a: .16, sp: .00031 },
  { x: .6, y: .85, r: .6,  c: '210,60,170', a: .14, sp: .00018 },
  { x: .15, y: .8, r: .45, c: '30,200,220', a: .10, sp: .00027 }
];
function init() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  const cols = ['255,255,255', '190,210,255', '255,230,190', '210,190,255'];
  stars = [];
  [[.5, .5, .9, .0000], [1, 1, .95, .02], [1.7, 1.8, 1, .05]].forEach(([r0, r1, al, dr], layer) => {
    const n = Math.round(W * H / (layer === 0 ? 2600 : layer === 1 ? 6500 : 22000));
    for (let i = 0; i < n; i++) stars.push({
      x: Math.random() * W, y: Math.random() * H, r: r0 + Math.random() * (r1 - r0),
      t: Math.random() * TAU, s: .008 + Math.random() * .025, c: cols[(Math.random() * 4) | 0], al, dr, big: layer === 2
    });
  });
  disk = Array.from({ length: 1100 }, () => {
    const d = Math.pow(Math.random(), .8);
    return { a: Math.random() * TAU, d: 1.18 + d * 2.1, sp: .016 / Math.pow(1 + d * 2, 1.3), sz: .4 + Math.random() * 1.5, k: d };
  });
  ring = Array.from({ length: 260 }, () => ({ a: Math.random() * TAU, d: 1.03 + Math.random() * .16, sp: .004 + Math.random() * .004, sz: .5 + Math.random() * 1.1 }));
}
function diskColor(k, br) {
  const h = 48 - k * 44, l = 62 + (1 - k) * 22;
  return 'hsla(' + h + ',100%,' + Math.min(92, l * br) + '%,' + Math.min(1, .35 + .65 * br * (1 - k * .55)) + ')';
}
function spawnShooter() {
  const fromLeft = Math.random() < .5;
  shooters.push({ x: Math.random() * W * .8, y: Math.random() * H * .45, vx: (fromLeft ? 1 : 1) * (7 + Math.random() * 5), vy: 2.5 + Math.random() * 3, life: 1 });
}
function draw() {
  T++;
  cx.globalCompositeOperation = 'source-over';
  cx.fillStyle = '#02030a'; cx.fillRect(0, 0, W, H);

  cx.globalCompositeOperation = 'lighter';
  NEB.forEach((n, i) => {
    const px = (n.x + Math.sin(T * n.sp + i) * .06) * W, py = (n.y + Math.cos(T * n.sp * 1.3 + i) * .05) * H, r = n.r * Math.max(W, H);
    const g = cx.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(' + n.c + ',' + n.a + ')'); g.addColorStop(.5, 'rgba(' + n.c + ',' + n.a * .35 + ')'); g.addColorStop(1, 'rgba(' + n.c + ',0)');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  });

  stars.forEach(s => {
    s.t += s.s;
    if (!reduce && s.dr) { s.y -= s.dr; if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; } }
    const a = s.al * (.4 + .6 * Math.abs(Math.sin(s.t)));
    cx.fillStyle = 'rgba(' + s.c + ',' + a + ')';
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, TAU); cx.fill();
    if (s.big && a > .8) {
      cx.strokeStyle = 'rgba(' + s.c + ',' + (a * .35) + ')'; cx.lineWidth = .6;
      cx.beginPath(); cx.moveTo(s.x - 5, s.y); cx.lineTo(s.x + 5, s.y); cx.moveTo(s.x, s.y - 5); cx.lineTo(s.x, s.y + 5); cx.stroke();
    }
  });

  if (!reduce) {
    if (Math.random() < .004 && shooters.length < 2) spawnShooter();
    shooters = shooters.filter(s => s.life > 0);
    shooters.forEach(s => {
      s.x += s.vx; s.y += s.vy; s.life -= .018;
      const g = cx.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9);
      g.addColorStop(0, 'rgba(255,255,255,' + s.life + ')'); g.addColorStop(1, 'rgba(160,180,255,0)');
      cx.strokeStyle = g; cx.lineWidth = 1.6;
      cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x - s.vx * 9, s.y - s.vy * 9); cx.stroke();
    });
  }

  const R = Math.min(W, H) * (W < 640 ? .15 : .13), X = W / 2, Y = H * (W < 640 ? .2 : .26), tilt = .28;
  const halo = cx.createRadialGradient(X, Y, R * .8, X, Y, R * 5);
  halo.addColorStop(0, 'rgba(255,170,80,.30)'); halo.addColorStop(.3, 'rgba(255,110,60,.12)'); halo.addColorStop(.6, 'rgba(139,123,255,.07)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
  cx.fillStyle = halo; cx.fillRect(0, 0, W, H);

  const back = [], front = [];
  disk.forEach(p => {
    if (!reduce) p.a += p.sp;
    const cs = Math.cos(p.a), sn = Math.sin(p.a);
    const px = X + cs * R * p.d, py = Y + sn * R * p.d * tilt;
    const br = .65 + .55 * (-cs);
    (sn < 0 ? back : front).push([px, py, p, br]);
    if (sn < 0) {
      /* ánh sáng bị bẻ cong: phần đĩa phía sau hiện thêm vòng cung phía trên hố đen */
      const lx = X + cs * R * (1.05 + p.k * .55), ly = Y - Math.abs(Math.sqrt(Math.max(0, 1 - cs * cs * .6))) * R * (1.05 + p.k * .55) * .95;
      back.push([lx, ly, p, br * .75]);
    }
  });
  const dot = arr => arr.forEach(([px, py, p, br]) => {
    cx.fillStyle = diskColor(p.k, br); cx.beginPath(); cx.arc(px, py, p.sz, 0, TAU); cx.fill();
  });
  dot(back);

  cx.globalCompositeOperation = 'source-over';
  cx.fillStyle = '#000'; cx.beginPath(); cx.arc(X, Y, R, 0, TAU); cx.fill();

  cx.globalCompositeOperation = 'lighter';
  const pr = cx.createRadialGradient(X, Y, R * .96, X, Y, R * 1.22);
  pr.addColorStop(0, 'rgba(255,220,160,.0)'); pr.addColorStop(.25, 'rgba(255,225,170,.75)'); pr.addColorStop(1, 'rgba(255,140,60,0)');
  cx.fillStyle = pr; cx.beginPath(); cx.arc(X, Y, R * 1.22, 0, TAU); cx.fill();
  ring.forEach(p => {
    if (!reduce) p.a += p.sp;
    cx.fillStyle = 'rgba(255,215,160,.85)'; cx.beginPath(); cx.arc(X + Math.cos(p.a) * R * p.d, Y + Math.sin(p.a) * R * p.d, p.sz, 0, TAU); cx.fill();
  });

  dot(front);

  cx.globalCompositeOperation = 'source-over';
  const v = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  cx.fillStyle = v; cx.fillRect(0, 0, W, H);

  if (!reduce) requestAnimationFrame(draw);
}
addEventListener('resize', () => { init(); if (reduce) draw(); });
init(); draw();
</script>
</body>
</html>
